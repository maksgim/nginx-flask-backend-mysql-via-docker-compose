services:
  nginx:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app_network

  backend:
    build:
      context: ./backend
    environment:
     - DB_HOST=mysql
     - DB_USER=${MYSQL_USER}
     - DB_PASSWORD=${MYSQL_PASSWORD}
     - DB_NAME=${MYSQL_DATABASE}
    depends_on:
     mysql:
       condition: service_healthy
    networks:
     - app_network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysql", "-uappuser", "-papppass","-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
